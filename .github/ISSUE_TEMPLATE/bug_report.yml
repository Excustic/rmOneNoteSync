name: 🐛 Bug Report
description: Create a report to help us fix issues with rmOneNoteSync
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible so we can reproduce and fix the issue.

  - type: input
    id: app-version
    attributes:
      label: Desktop App Version
      description: What version of the rmOneNoteSync desktop app are you running? (e.g., v0.6.0)
      placeholder: v0.6.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Desktop Operating System
      description: What OS is your computer running?
      options:
        - Windows 10 / 11
        - macOS
        - Linux (Ubuntu / Debian)
        - Linux (Fedora / RHEL)
        - Linux (Arch / Other)
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: reMarkable Device
      description: Which reMarkable tablet are you syncing with?
      options:
        - reMarkable 1
        - reMarkable 2
        - reMarkable Paper Pro
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Please drag and drop any relevant screenshots or paste your application logs here. (You can find logs in the 'Logs' tab of the desktop app).