name: Build and Package App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # --- JOB 1: THE UBUNTU HEAVY LIFTER ---
  build-core:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Inject Client ID
      run: sed -i 's/__REPLACE_ME__/${{ secrets.AZURE_CLIENT_ID }}/g' app/rmOneNoteSyncApp/appsettings.json
      
    - name: Download rmc binaries
      run: |
        curl -L -o app/rmOneNoteSyncApp/rmc-x64.exe https://github.com/Excustic/rmc/releases/download/alpha/rmc-x64.exe
        curl -L -o app/rmOneNoteSyncApp/rmc-linux-x64 https://github.com/Excustic/rmc/releases/download/alpha/rmc-linux-x64
        chmod +x app/rmOneNoteSyncApp/rmc-linux-x64

    - name: Publish Windows (Portable)
      run: dotnet publish app/rmOneNoteSyncApp/rmOneNoteSyncApp.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained true -o ./artifacts/windows

    - name: Publish Linux (Portable)
      run: dotnet publish app/rmOneNoteSyncApp/rmOneNoteSyncApp.csproj -c Release -r linux-x64 -p:PublishSingleFile=true --self-contained true -o ./artifacts/linux

    - name: Publish macOS (Portable)
      run: dotnet publish app/rmOneNoteSyncApp/rmOneNoteSyncApp.csproj -c Release -r osx-x64 -p:PublishSingleFile=true --self-contained true -o ./artifacts/macos

    - name: Build Ubuntu/Debian Package (.deb)
      run: dotnet msbuild app/rmOneNoteSyncApp/rmOneNoteSyncApp.csproj /t:CreateDeb /p:TargetFramework=net9.0 /p:RuntimeIdentifier=linux-x64 /p:Configuration=Release

    - name: Build Fedora/RedHat Package (.rpm)
      run: dotnet msbuild app/rmOneNoteSyncApp/rmOneNoteSyncApp.csproj /t:CreateRpm /p:TargetFramework=net9.0 /p:RuntimeIdentifier=linux-x64 /p:Configuration=Release
      
    - name: Collect Linux Packages
      run: |
        mkdir -p ./artifacts/linux-packages
        find app/rmOneNoteSyncApp -name "*.deb" -exec mv {} ./artifacts/linux-packages/ \;
        find app/rmOneNoteSyncApp -name "*.rpm" -exec mv {} ./artifacts/linux-packages/ \;
    
    - name: Upload Windows Portable
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Portable
        path: ./artifacts/windows

    - name: Upload Linux Portable
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Portable
        path: ./artifacts/linux

    - name: Upload macOS Portable
      uses: actions/upload-artifact@v4
      with:
        name: macOS-Portable
        path: ./artifacts/macos

    - name: Upload Linux Installers
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Installers-Deb-Rpm
        path: ./artifacts/linux-packages


  # --- JOB 2: THE WINDOWS SPECIALIST ---
  build-windows-installer:
    needs: build-core # Crucial: Tells GitHub to wait for the Ubuntu job to finish!
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Windows Portable Artifact
      uses: actions/download-artifact@v4
      with:
        name: Windows-Portable
        # We drop the downloaded files exactly where Inno Setup expects them
        path: artifacts/windows 

    - name: Compile Windows Installer (.exe)
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: installer.iss

    - name: Upload Windows Setup Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Installer-Exe
        path: artifacts/windows-installer


# --- JOB 3: THE CROSS-COMPILATION ORCHESTRA ---
  build-rm-daemon:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # <--- NEW: Prevents one failure from cancelling the rest!
      matrix:
        include:
          - device: chiappa
            url: https://storage.googleapis.com/remarkable-codex-toolchain/3.25.1.1/chiappa/remarkable-production-image-5.5.125-chiappa-public-x86_64-toolchain.sh
          - device: ferrari
            url: https://storage.googleapis.com/remarkable-codex-toolchain/3.25.1.1/ferrari/remarkable-production-image-5.5.125-ferrari-public-x86_64-toolchain.sh
          - device: rm2
            url: https://storage.googleapis.com/remarkable-codex-toolchain/3.25.1.1/rm2/remarkable-production-image-5.5.125-rm2-public-x86_64-toolchain.sh
          - device: rm1
            url: https://storage.googleapis.com/remarkable-codex-toolchain/3.25.1.1/rm1/remarkable-production-image-5.5.125-rm1-public-x86_64-toolchain.sh

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Toolchain
      run: curl -L -o toolchain.sh ${{ matrix.url }}

    - name: Install Toolchain
      run: |
        chmod +x toolchain.sh
        ./toolchain.sh -y -d /opt/codex/${{ matrix.device }}

    - name: Build Daemon Binaries
      # Removed the 'bash -c' wrapper so errors bubble up correctly
      run: |
        source /opt/codex/${{ matrix.device }}/environment-setup-*
        cd rm-daemon
        make clean
        make all
        
        echo "--- WHERE DID THE BINARIES GO? ---"
        ls -la

    - name: Package Device Artifacts
      run: |
        mkdir -p ./artifacts/rm-daemon-${{ matrix.device }}
        mv rm-daemon/watcher ./artifacts/rm-daemon-${{ matrix.device }}/watcher-${{ matrix.device }}
        mv rm-daemon/httpclient ./artifacts/rm-daemon-${{ matrix.device }}/httpclient-${{ matrix.device }}
        mv rm-daemon/cache_debug ./artifacts/rm-daemon-${{ matrix.device }}/cache_debug-${{ matrix.device }}

    - name: Upload Daemon Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rm-daemon-${{ matrix.device }}
        path: ./artifacts/rm-daemon-${{ matrix.device }}