name: Build and Package App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # --- JOB 1: THE UBUNTU HEAVY LIFTER ---
  build-core:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Inject Client ID
      run: sed -i 's/__REPLACE_ME__/${{ secrets.AZURE_CLIENT_ID }}/g' app/rmOneNoteSyncApp/appsettings.json
      
    - name: Download rmc binaries
      run: |
        curl -L -o app/rmOneNoteSyncApp/rmc-windows.exe https://github.com/Excustic/rmc/releases/download/alpha/rmc-x64.exe
        curl -L -o app/rmOneNoteSyncApp/rmc-linux https://github.com/Excustic/rmc/releases/download/alpha/rmc-linux-x64
        chmod +x app/rmOneNoteSyncApp/rmc-linux

    - name: Publish Windows (Portable)
      run: dotnet publish app/rmOneNoteSyncApp/rmOneNoteSyncApp.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained true -o ./artifacts/windows

    - name: Publish Linux (Portable)
      run: dotnet publish app/rmOneNoteSyncApp/rmOneNoteSyncApp.csproj -c Release -r linux-x64 -p:PublishSingleFile=true --self-contained true -o ./artifacts/linux

    - name: Publish macOS (Portable)
      run: dotnet publish app/rmOneNoteSyncApp/rmOneNoteSyncApp.csproj -c Release -r osx-x64 -p:PublishSingleFile=true --self-contained true -o ./artifacts/macos

    - name: Build Ubuntu/Debian Package (.deb)
      run: dotnet msbuild app/rmOneNoteSyncApp/rmOneNoteSyncApp.csproj /t:CreateDeb /p:TargetFramework=net9.0 /p:RuntimeIdentifier=linux-x64 /p:Configuration=Release

    - name: Build Fedora/RedHat Package (.rpm)
      run: dotnet msbuild app/rmOneNoteSyncApp/rmOneNoteSyncApp.csproj /t:CreateRpm /p:TargetFramework=net9.0 /p:RuntimeIdentifier=linux-x64 /p:Configuration=Release
      
    - name: Collect Linux Packages
      run: |
        mkdir -p ./artifacts/linux-packages
        find app/rmOneNoteSyncApp -name "*.deb" -exec mv {} ./artifacts/linux-packages/ \;
        find app/rmOneNoteSyncApp -name "*.rpm" -exec mv {} ./artifacts/linux-packages/ \;
    
    - name: Upload Windows Portable
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Portable
        path: ./artifacts/windows

    - name: Upload Linux Portable
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Portable
        path: ./artifacts/linux

    - name: Upload macOS Portable
      uses: actions/upload-artifact@v4
      with:
        name: macOS-Portable
        path: ./artifacts/macos

    - name: Upload Linux Installers
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Installers-Deb-Rpm
        path: ./artifacts/linux-packages


  # --- JOB 2: THE WINDOWS SPECIALIST ---
  build-windows-installer:
    needs: build-core # Crucial: Tells GitHub to wait for the Ubuntu job to finish!
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Windows Portable Artifact
      uses: actions/download-artifact@v4
      with:
        name: Windows-Portable
        # We drop the downloaded files exactly where Inno Setup expects them
        path: artifacts/windows 

    - name: Compile Windows Installer (.exe)
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: installer.iss

    - name: Upload Windows Setup Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Installer-Exe
        path: artifacts/windows-installer